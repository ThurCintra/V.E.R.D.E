# Teste temporário: os mesmos comandos do passo "Guardar o candidato" do treinar-taco.yml, com arquivos parecidos.
name: Teste de push do GITHUB_TOKEN

on:
  push:
    paths:
      - ".github/workflows/teste-push.yml"

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arquivos como os do treino
        run: |
          head -c 11000000 /dev/urandom > models/material_cls_taco.pt
          echo '{"teste": 1}' > reports/material_taco.json
          df -h / | tail -1
      - name: Guardar o candidato (os mesmos comandos)
        run: |
          set -x
          git config user.name "github-actions[bot]" 2>> erro.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" 2>> erro.txt
          for cmd in "git checkout -B teste-candidato" "git add -f models/material_cls_taco.pt reports/material_taco.json" \
                     "git commit -q -m teste" "git push -f origin teste-candidato"; do
            if ! $cmd 2>> erro.txt; then
              echo "::error title=Falhou: $cmd::$(tr '\n' ' ' < erro.txt | cut -c1-900)"; exit 1
            fi
          done
          echo "::notice title=Passo do candidato::funcionou"
