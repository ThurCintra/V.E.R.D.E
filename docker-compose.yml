# docker compose up -d                    → API (8000) + dashboard (8501)
x-app: &app
  build: .
  image: verde
  restart: unless-stopped
  volumes:
    - ./models:/app/models     # coloque aqui o waste_detector.pt treinado
    - ./storage:/app/storage   # histórico SQLite, compartilhado entre API e dashboard
  env_file:                    # GEMINI_API_KEY e afins (copie .env.example para .env); opcional
    - path: .env
      required: false
  environment:
    DETECTOR_CONF: ${DETECTOR_CONF:-0.25}
    WASTE_MODE: ${WASTE_MODE:-alta}                # rapido | alta | ultra
    WASTE_DETECTOR: ${WASTE_DETECTOR:-yolo-world}  # yolo-world | yoloe | coco
    WASTE_MODEL: ${WASTE_MODEL:-}                  # um peso específico (vazio = automático)
    WASTE_IMGSZ: ${WASTE_IMGSZ:-640}               # 960 ajuda com itens pequenos (mais lento)
    WASTE_MATERIAL_MODEL: ${WASTE_MATERIAL_MODEL:-auto}   # off desliga a 2ª etapa
    WASTE_MATERIAL_CONF: ${WASTE_MATERIAL_CONF:-0.5}
    WASTE_SINGLE_ITEM: ${WASTE_SINGLE_ITEM:-0}     # 1 = lixeira que fotografa um item por vez
    WASTE_REVIEW: ${WASTE_REVIEW:-1}               # guarda casos duvidosos em storage/review

services:
  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  dashboard:
    <<: *app
    command: >
      sh -c "python scripts/download_model.py &&
             streamlit run app/dashboard.py --server.address 0.0.0.0 --server.port 8501 --server.headless true"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    # Câmera do servidor na aba "Ao Vivo": descomente
    # devices:
    #   - /dev/video0:/dev/video0
